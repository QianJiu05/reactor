# 账号名单 —— 一行一个账号，服务器启动时加载
#
# 格式:  account[:password]
#
#   · 空行和 # 开头的行会被跳过
#   · 冒号后的密码列【本期保留但不校验】，可以省略冒号，也可以留空
#   · 账号名约束: 只允许字母、数字、下划线，长度 1~31
#     且不能是保留字 favicon.ico（浏览器会自动请求该路径）
#   · 账号名重复时保留第一个
#
# 一个账号 = 一路摄像头通道:
#   · 采集端启动时发 "CAM <账号>\r\n" 注册，同一账号同时只允许一个采集端
#   · 查看端用浏览器访问 http://<服务器IP>:8888/<账号> 观看
#
# ⚠ 本版不校验密码: 知道账号名即可观看，也能尝试用该账号名注册采集端
#   （会被"已有采集端"规则挡住）。这不是访问控制，只是通道标识。

